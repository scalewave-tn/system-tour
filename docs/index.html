<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Tour</title>
<style>
:root{
  --bg:#141210; --panel:#1b1916; --panel-2:#221f1b; --line:#2e2a25;
  --text:#ece6dc; --muted:#a39b8f; --faint:#6d665c;
  --accent:#c9d98f; --req:#e2a85c; --res:#8fc78a; --evt:#b392e6; --ai:#e6d16a; --err:#ef6a55;
  --tc:#e58a6f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font:inherit}
.app{display:grid;grid-template-columns:1fr 370px;grid-template-rows:auto 1fr auto;height:100vh;min-height:640px}
header{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .crumb{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
header h1{margin:0;font-family:var(--mono);font-size:19px;font-weight:600}
.cats{margin-left:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.cat{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer}
.cat.home{color:var(--accent)}
.langs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.langs:empty{display:none}
.langs button{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:6px 10px;border-radius:7px;cursor:pointer;text-transform:uppercase}
.langs button:hover{color:var(--text)}
.langs button.on{background:var(--panel-2);color:var(--accent);box-shadow:inset 0 0 0 1px #4a443c}
.cat:hover{color:var(--text)}
.cat.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px #4a443c}
.cat .n{color:var(--faint);margin-left:4px}

.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%, #1d1a16 0%, var(--bg) 70%)}
.stage svg{width:100%;height:100%;display:block}
.scen{position:absolute;top:10px;left:12px;right:330px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;background:#1b1916e6;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip:hover{color:var(--text);border-color:#4a443c}
.chip.on{color:#1a1a12;background:var(--accent);border-color:var(--accent)}
.ctrl{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.btn{font-family:var(--mono);font-size:12px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:#4a443c}
.btn.primary{background:#2c3320;border-color:#4d5a33;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{background:var(--panel-2);border:0;color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:6px 9px;cursor:pointer}
.speed button.on{background:#3a3a2a;color:var(--accent)}
.stamp{position:absolute;top:52px;left:12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#ffd3c6;background:#4a2219;border:1px dashed var(--tc);padding:4px 10px;border-radius:6px;display:none}
.stamp.on{display:block}
.caption{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:min(760px,92%);background:#141210ee;border:1px solid #3a352e;border-radius:12px;padding:9px 16px;font-size:15px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px #0008}
.caption .k{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.caption .route{font-family:var(--mono);font-size:13px;white-space:nowrap}
.caption .what{color:var(--text)}
.caption:empty{display:none}
.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend .dash{width:14px;height:0;border-radius:0;border-top:1.5px dashed var(--tc)}

aside{grid-row:2/4;grid-column:2;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.guide{padding:18px 20px 12px;flex:1;overflow:auto}
.kicker{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.scen-title{font-family:var(--mono);font-size:13px;color:var(--accent);margin:4px 0 2px}
.guide h2{font-family:var(--mono);font-size:18px;margin:4px 0 10px;line-height:1.25}
.guide p{margin:0 0 9px;color:#d6cfc4}
.guide code{font-family:var(--mono);font-size:12px;background:#2a2621;padding:1px 5px;border-radius:4px;color:var(--text)}
.callout{margin-top:12px;border-radius:10px;padding:9px 12px;font-size:13px;border:1px solid}
.callout b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.callout.tip{background:#262b1d;border-color:#3e4a2b;color:#d3dcb7}
.callout.tc{background:#2c1f1a;border-color:#5d3a2f;color:#efc3b4}
.callout.bad{background:#2e1b18;border-color:#6a3127;color:#f2bdb2}
.facts{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.facts li{font-size:13px;color:#cfc7bb;padding-left:16px;position:relative}
.facts li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.moves{margin:14px 0 0;counter-reset:m;border-top:1px solid var(--line);padding-top:10px}
.moves h3{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:500}
.moves li{counter-increment:m;display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12.5px;color:#9c9488;padding:4px 6px;border-radius:6px;transition:background .25s,color .25s;cursor:pointer}
.moves li:hover{background:#24211c}
.moves li::before{content:counter(m);font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.moves li .r{font-family:var(--mono);font-size:11.5px}
.moves li.now{background:#2a2720;color:var(--text)}
.moves li.now::before{color:var(--accent)}
.moves li.past{color:#bdb5a9}
.sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.slide-in{animation:slide .36s cubic-bezier(.2,.7,.2,1) both}
.slide-in.d1{animation-delay:.04s}.slide-in.d2{animation-delay:.08s}.slide-in.d3{animation-delay:.12s}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.now{margin:12px 0 4px;border:1px solid #3e4a2b;background:#20251a;border-radius:10px;padding:9px 12px;min-height:56px}
.now b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.now .t{font-size:13px;color:#d6cfc4;display:grid;gap:3px}
.now .t .s{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.areas{margin-top:14px;display:grid;gap:14px}
.areas h3{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:500;text-transform:uppercase}
.area{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 9px;color:#cfc7bb;cursor:pointer;transition:background .3s,border-color .3s}
.area:hover{background:#24211c}
.area .nm{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.area .nm::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#4a443c;margin-right:8px;vertical-align:2px;transition:background .3s,box-shadow .3s}
.area .sm{display:block;font-size:12px;color:#9c9488;margin:2px 0 0 14px}
.area.live{background:#2a2720;border-color:#3a352e}
.area.live .nm::before{background:var(--accent);box-shadow:0 0 0 3px #c9d98f33}
.nav{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.nav .btn.primary{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{padding:0 20px 12px;font-family:var(--mono);font-size:11px;color:var(--faint)}

.strip{grid-column:1;border-top:1px solid var(--line);padding:10px 20px 12px;background:var(--panel)}
.strip .head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px}
.steps{display:grid;position:relative}
.steps .track{position:absolute;top:11px;height:1px;background:var(--line)}
.steps .bar{position:absolute;top:11px;height:2px;background:var(--accent);transition:width .4s ease}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:11px;padding:0;text-align:center}
.step .dot{width:22px;height:22px;border-radius:50%;border:1px solid #4a443c;background:var(--bg);display:grid;place-items:center;font-size:10px;color:var(--muted);transition:all .2s}
.step.done .dot{background:#2c3320;border-color:#4d5a33;color:var(--accent)}
.step.on .dot{background:var(--accent);border-color:var(--accent);color:#1a1a12;box-shadow:0 0 0 4px #c9d98f22}
.step.on{color:var(--text)}

/* SVG */
.node{transition:opacity .45s ease, filter .45s ease}
.node.dim{opacity:.16;filter:saturate(.3)}
.node.soft{opacity:.42;filter:saturate(.55)}
.node-lbl.soft{opacity:.42}
.node.down{filter:grayscale(.9) brightness(.7)}
.node-lbl{transition:opacity .45s ease}
.node-lbl text{paint-order:stroke;stroke:#141210;stroke-width:3px;stroke-linejoin:round}
.node-lbl.dim{opacity:.16}
.node-lbl.down{opacity:.6}
.wire{fill:none;stroke:#3a352e;stroke-width:1.4;transition:opacity .4s, stroke .4s}
.wire.on{stroke:#cfc4b1;stroke-width:1.8;stroke-dasharray:5 6;animation:march 1.6s linear infinite}
.wire.dim{opacity:.18}
.wire.tc.on{stroke:var(--tc)}
@keyframes march{to{stroke-dashoffset:-22}}
.lbl{font-family:var(--mono);font-size:12px;font-weight:600;fill:#f3eee6;text-anchor:middle;pointer-events:none}
.sub{font-family:var(--mono);font-size:9.5px;fill:#b9b0a3;text-anchor:middle}
.pill{transition:opacity .45s}
.pill rect{fill:#1b1916;stroke:#4a443c}
.pill text{font-family:var(--mono);font-size:10.5px;fill:#e8e1d6}
.pill.tc rect{stroke:var(--tc);stroke-dasharray:3 2}
.pill.tc .badge{fill:var(--tc);font-size:8.5px}
.zone{fill:none;stroke:#5a5348;stroke-width:1.2;stroke-dasharray:6 6;transition:opacity .5s}
.zone-txt{font-family:var(--mono);font-size:11px;letter-spacing:.18em;fill:#7a7266;text-transform:uppercase}
.pkt-tag rect{fill:#141210;stroke-width:1.2}
.pkt-tag text{font-family:var(--mono);font-size:12px;font-weight:600}
.badge-down text{font-family:var(--mono);font-size:10px;font-weight:700;fill:#fff;letter-spacing:.08em}
.badge-x text{font-family:var(--mono);font-size:10px;font-weight:700;fill:#1a1a12}
@media (max-width: 980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 460px auto auto;height:auto}
  header{grid-column:1}
  .cats{margin-left:0;flex-wrap:wrap}
  aside{grid-row:4;grid-column:1;border-left:0;border-top:1px solid var(--line)}
  .strip{grid-row:3}
  .step span{display:none}
  .legend,.caption .route{display:none}
  .scen{right:12px;top:52px}
  .ctrl{left:12px;right:auto}
  .stamp{top:auto;bottom:60px;left:50%;transform:translateX(-50%);white-space:nowrap}
  .caption{bottom:10px;font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="crumb" id="crumb"></div>
      <h1 id="heading"></h1>
    </div>
    <nav class="cats" id="cats" aria-label="Scenario groups"></nav>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </header>

  <section class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated isometric map of the system"></svg>
    <div class="scen" id="scen"></div>
    <div class="ctrl">
      <div class="speed" id="speed" aria-label="Speed"></div>
      <button class="btn" id="replay" title="Replay (r)">↺</button>
      <button class="btn" id="mprev" title="Previous move ( , )">⏮</button>
      <button class="btn" id="pause" title="Pause (space)">❚❚</button>
      <button class="btn" id="mnext" title="Next move ( . )">⏭</button>
    </div>
    <div class="stamp" id="stamp" data-ui="hypo"></div>
    <div class="caption" id="caption"></div>
    <div class="legend">
      <span><i style="background:var(--req)"></i><span data-ui="req"></span></span>
      <span><i style="background:var(--res)"></i><span data-ui="res"></span></span>
      <span><i style="background:var(--evt)"></i><span data-ui="evt"></span></span>
      <span><i style="background:var(--ai)"></i><span data-ui="ai"></span></span>
      <span><i style="background:var(--err)"></i><span data-ui="err"></span></span>
      <span><i class="dash"></i><span data-ui="tc"></span></span>
    </div>
  </section>

  <aside>
    <div class="guide" id="guide"></div>
    <div class="nav">
      <button class="btn" id="back">←</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
    <div class="keys" data-ui="keys"></div>
  </aside>

  <div class="strip">
    <div class="head"><span id="strip-title">STEPS</span><span id="count"></span></div>
    <div class="steps" id="steps"></div>
  </div>
</div>

// ---------------- node drawing
function cube(g, x, y, kind, a = 1.25, h = 26) {

  el('polygon', {points: pts([[x-w,y-h],[x,y-h+hh],[x,y+hh],[x-w,y]]), fill:left, stroke:edge, 'stroke-opacity':.5, 'stroke-linejoin':'round'}, g);
  el('polygon', {points: pts([[x,y-h+hh],[x+w,y-h],[x+w,y],[x,y+hh]]), fill:right, stroke:edge, 'stroke-opacity':.5, 'stroke-linejoin':'round'}, g);
  el('polygon', {points: pts([[x,y-h-hh],[x+w,y-h],[x,y-h+hh],[x-w,y-h]]), fill:top, stroke:edge, 'stroke-width':1.4, 'stroke-linejoin':'round'}, g);

}

}
function people(g, x, y, small) {

function extBox(g, x, y) {

function pill(g, x, y, text, sub, tc) {

const nodeEls = {}, pillEls = {}, lblEls = {};

let FULL_VIEW = '';

// narrow screens: zoom on what the step uses, so labels stay readable
const narrow = window.matchMedia('(max-width: 980px)');
function fitView(used) {
  if (!narrow.matches) { svg.setAttribute('viewBox', FULL_VIEW); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of used) for (const e of [nodeEls[id], pillEls[id], lblEls[id]]) {
    if (!e) continue; const b = e.getBBox();

}

// ---------------- per-step decorations: replicas, down badges

// ---------------- packets / timeline
const COLORS = {req:'#e2a85c', res:'#8fc78a', evt:'#b392e6', ai:'#e6d16a', err:'#ef6a55'};
const SPEEDS = [0.5, 1, 2];
let speed = 1, paused = false, clock = 0, last = 0, total = 0, packets = [];
let cat = 0, sc = 0, step = 0, curFlow = -1;
let mode = 'tour', runs = [], liveSig = null;

function ring(x, y, color) {
  if (reduced) return;
  const c = el('circle', {cx:x, cy:y, r:7, fill:'none', stroke:color, 'stroke-width':2}, gFx);
  c.style.transformOrigin = `${x}px ${y}px`; c.style.transformBox = 'view-box';
  c.animate([{transform:'scale(.8)', opacity:.9},{transform:'scale(2.6)', opacity:0}], {duration:700, easing:'ease-out'}).onfinish = () => c.remove();
}

function resetPackets() {
  gPkt.innerHTML = ''; gFx.innerHTML = '';
  packets = []; clock = 0; curFlow = -1;
}
// lays one step's moves on the timeline from t0 and returns when the last one lands
function addFlows(flows, t0, run) {
  let prevStart = t0, prevEnd = t0 + 400;
  const parkCount = {};
  flows.forEach(f => {
    const [a, b, type, rawLabel, o = {}] = f;
    const label = L(rawLabel);
    const path = el('path', {d: pathD(R(a, b)), fill:'none', stroke:'none'}, gPkt);
    const len = path.getTotalLength();
    const dur = Math.max(1700, len * 4.2);
    const start = o.with ? prevStart : prevEnd + 350;
    const color = COLORS[type];
    const dot = el('g', {opacity:0}, gPkt);
    el('circle', {r:9, fill:color, 'fill-opacity':.22}, dot);
    el('circle', {r:5, fill:color, filter:'url(#glow)'}, dot);
    let tag = null;
    if (label) {
      tag = el('g', {class:'pkt-tag', opacity:0}, gFx);
      const r = el('rect', {rx:7, height:22, stroke:color}, tag);
      el('text', {fill:color, x:9, y:15}, tag).textContent = label;
      tag._w = label.length * 7.3 + 18; r.setAttribute('width', tag._w);
    }
    let parkOff = null;
    if (o.park) { const t = base(b); parkCount[t] = (parkCount[t] || 0); parkOff = [-34 - parkCount[t] * 13, 26]; parkCount[t]++; }
    const p = {path, len, dur, start, end: start + dur, dot, tag, color, o, a, b, type, label, parkOff, fired:false, i: packets.length, run};
    packets.push(p);
    prevStart = start; prevEnd = Math.max(prevEnd, p.end);
  });
  return prevEnd;
}
function buildPackets(st) {
  resetPackets();
  total = addFlows(st.flows, 0, 0) + 2600;
}

function place(p, frac) {
  const pt = p.path.getPointAtLength(frac * p.len);
  return [pt.x, pt.y];
}

function render() {
  let cur = -1;
  for (const p of packets) {
    if (reduced) {
      const [x, y] = place(p, p.o.block ? 0.8 : 0.5);
      p.dot.setAttribute('transform', `translate(${x},${y})`); p.dot.setAttribute('opacity', 1);
      if (p.tag) { p.tag.setAttribute('transform', `translate(${x - p.tag._w/2},${y - 34})`); p.tag.setAttribute('opacity', 1); }
      continue;
    }
    const t = (clock - p.start) / p.dur;
    if (t < 0) { p.dot.setAttribute('opacity', 0); if (p.tag) p.tag.setAttribute('opacity', 0); continue; }
    if (clock >= p.start) cur = Math.max(cur, p.i);
    const stopAt = p.o.block ? 0.8 : 1;
    if (t < 1) {
      const e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      const [x, y] = place(p, e * stopAt);
      p.dot.setAttribute('transform', `translate(${x},${y})`);
      p.dot.setAttribute('opacity', Math.min(1, t * 8));
      if (p.tag) { p.tag.setAttribute('transform', `translate(${x - p.tag._w/2},${y - 36})`); p.tag.setAttribute('opacity', Math.min(1, t * 8)); }
      continue;
    }
    // arrived
    const [x, y] = place(p, stopAt);
    if (!p.fired) { p.fired = true; ring(x, y, p.o.block ? COLORS.err : p.color); }
    const after = clock - p.end;
    if (p.o.block) {               // stays, blinking red, until the loop ends
      p.dot.setAttribute('transform', `translate(${x},${y})`);
      p.dot.setAttribute('opacity', 0.55 + 0.45 * Math.abs(Math.sin(after / 260)));
      if (p.tag) { p.tag.setAttribute('transform', `translate(${x - p.tag._w/2},${y - 36})`); p.tag.setAttribute('opacity', mode === 'home' ? Math.max(0, 1 - Math.max(0, after - 1300) / 500) : 1); }
    } else if (p.o.park) {         // waits beside the queue
      const px = x + p.parkOff[0], py = y + p.parkOff[1];
      p.dot.setAttribute('transform', `translate(${px},${py})`); p.dot.setAttribute('opacity', 1);
      if (p.tag) { const f = Math.max(0, 1 - Math.max(0, after - 1800) / 600); p.tag.setAttribute('transform', `translate(${x - p.tag._w/2},${y - 36})`); p.tag.setAttribute('opacity', f); }
    } else {                       // label lingers so it can be read
      p.dot.setAttribute('opacity', 0);
      if (p.tag) { const f = Math.max(0, 1 - Math.max(0, after - 1300) / 500); p.tag.setAttribute('transform', `translate(${x - p.tag._w/2},${y - 36})`); p.tag.setAttribute('opacity', f); }
    }
  }
  if (reduced) cur = packets.length - 1;
  if (cur !== curFlow) { curFlow = cur; showCurrent(); }
  if (mode === 'home') homeLive();
}

function frame(now) {
  const dt = last ? Math.min(100, now - last) : 0; last = now;
  if (!paused && !reduced) {
    clock += dt * speed;
    if (clock > total) { clock = 0; packets.forEach(p => p.fired = false); gFx.querySelectorAll('circle').forEach(c => c.remove()); }
  }
  render();
  requestAnimationFrame(frame);
}

function stripTrack(box, n, done) {

function go(c, s, j) {
  mode = 'tour';
  cat = c; sc = s; step = j;
  const st = stepData(), scn = scenario();
  // nodes in view
  const used = new Set();
  st.flows.forEach(f => { used.add(base(f[0])); used.add(base(f[1])); });
  (st.down || []).forEach(id => used.add(id));
  (st.extra || []).forEach(id => used.add(id));
  for (const id in nodeEls) { nodeEls[id].classList.remove('soft'); nodeEls[id].classList.toggle('dim', !used.has(id)); }
  for (const id in pillEls) pillEls[id].style.opacity = used.has(id) ? 1 : .16;
  for (const id in lblEls) { lblEls[id].classList.remove('soft'); lblEls[id].classList.toggle('dim', !used.has(id)); }
  fitView(used);
  const active = new Set(st.flows.map(f => wireKey(f[0], f[1])));
  for (const [k, w] of wires) { w.classList.toggle('on', active.has(k)); w.classList.toggle('dim', !active.has(k)); }
  decorate(st);
  $('stamp').classList.toggle('on', !!st.hypo);

  const sw = t => `<i class="sw" style="background:${COLORS[t]}"></i>`;
  const callout = st.callout ? `<div class="callout ${st.callout[0]} slide-in d3"><b>${L(st.callout[1])}</b>${L(st.callout[2])}</div>` : '';
  const facts = st.facts ? `<ul class="facts slide-in d3">${paras(st.facts).map(f => `<li>${f}</li>`).join('')}</ul>` : '';
  const moves = `<div class="moves slide-in d3"><h3>${U('moves')}</h3><ol id="moves" style="margin:0;padding:0;list-style:none">${st.flows.map(f =>
      `<li><div><span class="r">${sw(f[2])}${nm(f[0])} → ${nm(f[1])}</span>${L(f[3]) ? `<br>${L(f[3])}` : ''}</div></li>`).join('')}</ol></div>`;
  $('guide').innerHTML = `
    <div class="kicker slide-in">${L(CATS[cat].name)} · ${U('stepOf', {a: step + 1, b: scn.steps.length})}</div>
    <div class="scen-title slide-in">${L(scn.name)}</div>
    <h2 class="slide-in d1">${st.hypo ? '⚠ ' : ''}${L(st.title)}</h2>
    <div class="slide-in d2">${paras(st.body).map(p => `<p>${p}</p>`).join('')}</div>
    ${callout}${facts}${moves}`;
  document.querySelectorAll('#moves li').forEach((li, i) => { li.onclick = () => seekFlow(i); li.title = U('showMove'); });
  renderCats(); renderSteps();
  $('back').disabled = !HOME_RUNS.length && cat === 0 && sc === 0 && step === 0;
  $('mprev').disabled = $('mnext').disabled = false;
  const nx = nextPos();
  $('next').textContent = nx ? `${U('next')}: ${L(nx[3])} →` : U('again');
  try { history.replaceState(null, '', `#${CATS[cat].id}/${scn.id}/${step + 1}`); } catch (e) {}
  setPaused(false);
  buildPackets(st);
  showCurrent();
}

// ---------------- home: several areas of the system running at once
const HOME_RUNS = (() => {
  const out = [];
  if (Array.isArray(HOME.play)) {
    for (const ref of HOME.play) {
      const [c, s, j] = String(ref).split('/');
      const ci = CATS.findIndex(x => x.id === c); if (ci < 0) continue;
      const si = CATS[ci].scen.findIndex(x => x.id === s); if (si < 0) continue;
      const steps = CATS[ci].scen[si].steps;
      if (j) { if (steps[+j - 1]) out.push([ci, si, +j - 1]); }
      else steps.forEach((st, sj) => out.push([ci, si, sj]));
    }
  } else if (HOME.play !== false) {   // default: the normal-use steps of the first category
    CATS[0].scen.forEach((s, si) => s.steps.forEach((st, sj) => {
      if (!st.hypo && !(st.down || []).length && !st.scale) out.push([0, si, sj]);
    }));
  }
  return out;
})();
const sameScen = (r, ci, si) => r[0] === ci && r[1] === si;

function goHome() {
  if (!HOME_RUNS.length) return go(0, 0, 0);
  mode = 'home';
  resetPackets(); runs = []; liveSig = null;
  let t = 0, endMax = 0;
  (reduced ? HOME_RUNS.slice(0, 1) : HOME_RUNS).forEach((ref, k) => {
    const st = CATS[ref[0]].scen[ref[1]].steps[ref[2]];
    const first = packets.length;
    const end = addFlows(st.flows, t, k);
    const nodes = new Set();
    st.flows.forEach(f => { nodes.add(base(f[0])); nodes.add(base(f[1])); });
    runs.push({ref, start: packets[first] ? packets[first].start : t, end, nodes, wires: new Set(st.flows.map(f => wireKey(f[0], f[1])))});
    endMax = Math.max(endMax, end);
    t += (end - t) * 0.5;               // the next area starts halfway through this one
  });
  total = endMax + 1500;

  decorate({});
  $('stamp').classList.remove('on');
  for (const id in nodeEls) nodeEls[id].classList.remove('dim');
  for (const id in pillEls) pillEls[id].style.opacity = 1;
  for (const id in lblEls) lblEls[id].classList.remove('dim');
  for (const [, w] of wires) w.classList.remove('on', 'dim');
  fitView(new Set(Object.keys(nodeEls)));

  $('guide').innerHTML = `
    <div class="kicker slide-in">${U('home')}</div>
    <h2 class="slide-in d1">${L(HOME.title) || U('homeTitle')}</h2>
    <div class="slide-in d2">${paras(HOME.intro).map(p => `<p>${p}</p>`).join('')}<p>${U('pickArea')}</p></div>
    <div class="now slide-in d2"><b>${U('nowRunning')}</b><div class="t" id="now-t"></div></div>
    <div class="areas slide-in d3">${CATS.map((c, ci) => `<div><h3>${L(c.name)}</h3>${c.scen.map((s, si) =>
      `<button class="area" data-c="${ci}" data-s="${si}"><span class="nm">${L(s.name)}</span>${s.summary ? `<span class="sm">${L(s.summary)}</span>` : ''}</button>`).join('')}</div>`).join('')}</div>`;
  document.querySelectorAll('.area').forEach(a => { a.onclick = () => go(+a.dataset.c, +a.dataset.s, 0); });
  renderCats(); renderHomeStrip();
  $('caption').innerHTML = '';
  $('back').disabled = true;
  $('mprev').disabled = $('mnext').disabled = true;
  $('next').textContent = `${U('start')} →`;
  try { history.replaceState(null, '', '#home'); } catch (e) {}
  setPaused(false);
  homeLive();
}
function renderHomeStrip() {
  const seen = [];
  HOME_RUNS.forEach(r => { if (!seen.some(x => sameScen(r, x[0], x[1]))) seen.push([r[0], r[1]]); });
  const box = $('steps');
  stripTrack(box, seen.length, null);
  seen.forEach(([ci, si], k) => {
    const b = document.createElement('button');
    b.className = 'step'; b.dataset.c = ci; b.dataset.s = si;
    b.innerHTML = `<span class="dot">${k + 1}</span><span>${L(CATS[ci].scen[si].name)}</span>`;
    b.onclick = () => go(ci, si, 0);
    box.appendChild(b);
  });
  $('strip-title').textContent = (L(HOME.title) || U('homeTitle')).toUpperCase();
  $('count').textContent = `${seen.length} ${U('areas')}`;
}
// light what the running areas use; called every frame, does work only when that set changes
function homeLive() {
  const live = runs.filter(r => clock >= r.start && clock <= r.end + 600);
  const sig = live.map(r => r.ref.join('.')).join('|');
  if (sig === liveSig) return;
  liveSig = sig;
  const nodes = new Set(), wk = new Set();
  live.forEach(r => { r.nodes.forEach(n => nodes.add(n)); r.wires.forEach(w => wk.add(w)); });
  const soft = id => live.length > 0 && !nodes.has(id);
  for (const id in nodeEls) nodeEls[id].classList.toggle('soft', soft(id));
  for (const id in pillEls) pillEls[id].style.opacity = soft(id) ? .42 : 1;
  for (const id in lblEls) lblEls[id].classList.toggle('soft', soft(id));
  for (const [k, w] of wires) w.classList.toggle('on', wk.has(k));
  const isLive = (ci, si) => live.some(r => sameScen(r.ref, ci, si));
  document.querySelectorAll('.area').forEach(a => a.classList.toggle('live', isLive(+a.dataset.c, +a.dataset.s)));
  document.querySelectorAll('#steps .step').forEach(b => b.classList.toggle('on', isLive(+b.dataset.c, +b.dataset.s)));
  const latest = live[live.length - 1];
  if (!latest) return;
  const [ci, si, sj] = latest.ref, s = CATS[ci].scen[si], st = s.steps[sj];
  const t = $('now-t');
  if (t) t.innerHTML = live.map(r => {
    const rs = CATS[r.ref[0]].scen[r.ref[1]];
    return `<div><span class="s">${L(rs.name)}</span> · ${L(rs.steps[r.ref[2]].title)}</div>`;
  }).join('');
  $('caption').innerHTML = `<span class="what"><span style="color:var(--accent)">●</span> ${L(s.name)} · ${L(st.title)}</span>`;
}

function refresh() { mode === 'home' ? goHome() : go(cat, sc, step); }
function setLang(l) {
  lang = l;
  try { localStorage.setItem('system-tour-lang', l); } catch (e) {}
  applyStatic(); drawLabels(); fitAll(); refresh();
}

function nextPos() {
  const s = scenario();
  if (step < s.steps.length - 1) return [cat, sc, step + 1, s.steps[step + 1].nav];
  if (sc < CATS[cat].scen.length - 1) return [cat, sc + 1, 0, CATS[cat].scen[sc + 1].name];
  if (cat < CATS.length - 1) return [cat + 1, 0, 0, CATS[cat + 1].scen[0].name];
  return null;
}
function prevPos() {
  if (step > 0) return [cat, sc, step - 1];
  if (sc > 0) return [cat, sc - 1, CATS[cat].scen[sc - 1].steps.length - 1];
  if (cat > 0) { const ps = CATS[cat - 1].scen; return [cat - 1, ps.length - 1, ps[ps.length - 1].steps.length - 1]; }
  return null;
}
// jump to one move and hold it there, paused, with its label in view
function seekFlow(i) {
  if (mode === 'home' || reduced || !packets.length) return;
  if (i >= packets.length) { $('next').click(); if (mode === 'tour') seekFlow(0); return; }
  if (i < 0) {
    const p = prevPos(); if (!p) return;
    go(...p); seekFlow(packets.length - 1); return;
  }
  const p = packets[i];
  clock = p.start + p.dur * 0.7;
  packets.forEach(q => q.fired = q.end <= clock);
  gFx.querySelectorAll('circle').forEach(c => c.remove());
  setPaused(true);
  render();
}
function moveNext() {
  if (mode === 'home') return;
  if (curFlow < 0) return seekFlow(0);
  const s = packets[curFlow].start;
  const j = packets.findIndex(q => q.start > s);
  seekFlow(j < 0 ? packets.length : j);
}
function movePrev() {
  if (mode === 'home') return;
  if (curFlow <= 0) return seekFlow(-1);
  const s = packets[curFlow].start;
  let j = -1;
  packets.forEach((q, k) => { if (q.start < s) j = k; });
  if (j < 0) return seekFlow(-1);
  seekFlow(packets.findIndex(q => q.start === packets[j].start));
}

function setPaused(p) { paused = p; $('pause').textContent = paused ? '▶' : '❚❚'; }
function setSpeed(v) {
  speed = v;
  [...$('speed').children].forEach(b => b.classList.toggle('on', +b.dataset.v === v));
}
SPEEDS.forEach(v => {
  const b = document.createElement('button'); b.dataset.v = v; b.textContent = v + '×';
  b.onclick = () => setSpeed(v); $('speed').appendChild(b);
});
setSpeed(1);

$('back').onclick = () => { const p = prevPos(); if (p) go(...p); else if (HOME_RUNS.length) goHome(); };
$('next').onclick = () => {
  if (mode === 'home') return go(0, 0, 0);
  const n = nextPos();
  if (n) go(n[0], n[1], n[2]); else if (HOME_RUNS.length) goHome(); else go(0, 0, 0);
};
$('replay').onclick = () => { if (mode === 'home') return goHome(); setPaused(false); buildPackets(stepData()); };
$('pause').onclick = () => setPaused(!paused);
$('mnext').onclick = moveNext;
$('mprev').onclick = movePrev;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('back').click();
  else if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'r') $('replay').click();
  else if (e.key === '.') moveNext();
  else if (e.key === ',') movePrev();
  else if (['1','2','3'].includes(e.key)) setSpeed(SPEEDS[+e.key - 1]);
});

// start from the address (#cat/scenario/step) when present, else on the home view
const h = (location.hash || '').slice(1).split('/');
const ci = CATS.findIndex(c => c.id === h[0]);
if (ci >= 0) {
  const si = Math.max(0, CATS[ci].scen.findIndex(s => s.id === h[1]));
  const sj = Math.min(CATS[ci].scen[si].steps.length - 1, Math.max(0, (+h[2] || 1) - 1));
  go(ci, si, sj);
} else goHome();
requestAnimationFrame(frame);
})();
</script>
</body>
